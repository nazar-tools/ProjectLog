<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Project Log</title>
  <meta name="description" content="Weekly project planning, notes and time tracking.">
  <meta name="theme-color" content="#f9f9f7">
  <script>
    (function () {
      var t = 'auto';
      try { t = (JSON.parse(localStorage.getItem('projectlog.v1') || '{}').settings || {}).theme || 'auto'; } catch (e) {}
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0d0d0d' : '#f9f9f7');
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="root"><p style="padding:24px;font-family:system-ui">Loading Project Log…</p></div>
  <noscript><p style="padding:24px">Project Log needs JavaScript turned on.</p></noscript>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('Service worker not registered', e); }); });
    }
  </script>
</body>
</html>
