<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Project Log tests</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; }
    .pass { color: #1f6b3f; }
    .fail { color: #c0392b; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Project Log tests</h1>
  <p>Checks the data logic in js/store.js. Open this page after editing that file; every line should be green.
    It never touches your saved data.</p>
  <p id="summary"></p>
  <ol id="out"></ol>

  <script src="js/store.js"></script>
  <script>
    const S = window.Store;
    const out = document.getElementById('out');
    let failed = 0;

    function test(name, fn) {
      const li = document.createElement('li');
      try {
        fn();
        li.className = 'pass';
        li.textContent = name;
      } catch (e) {
        failed++;
        li.className = 'fail';
        li.textContent = `${name}: ${e.message}`;
      }
      out.appendChild(li);
    }
    function eq(actual, expected) {
      const a = JSON.stringify(actual);
      const b = JSON.stringify(expected);
      if (a !== b) throw new Error(`expected ${b}, got ${a}`);
    }

    function sample() {
      const s = S.fromSeed({
        people: [{ name: 'Ana', colour: 'blue' }, { name: 'Bo', colour: 'url(evil)' }],
        projects: [{ number: '26208', name: 'Clinic', pm: 'Ana' }, { number: '25063', name: 'School' }]
      });
      // A: a, a1, a2 (a1 and a2 indented under a), then b, then c.
      s.items = ['a', 'a1', 'a2', 'b', 'c'].map(id => ({
        id, pid: 'p_26208', text: id, kind: 'task', level: id.length - 1, done: false, doneAt: '', created: '2026-10-01'
      }));
      return s;
    }
    const order = s => S.itemsFor(s, 'p_26208').map(i => i.id);

    test('weekKey gives the Monday', () => {
      eq(S.weekKey(new Date(2026, 9, 18)), '2026-10-12');
      eq(S.weekKey(new Date(2026, 9, 12)), '2026-10-12');
    });
    test('addDays survives the daylight saving change', () => {
      eq(S.iso(S.addDays(S.parseISO('2026-11-01'), 1)), '2026-11-02');
      eq(S.iso(S.addDays(S.parseISO('2026-03-08'), 7)), '2026-03-15');
    });
    test('roundQ rounds to quarter hours', () => {
      eq([0.1, 0.13, 0.5, 1.37, 2.9].map(S.roundQ), [0, 0.25, 0.5, 1.25, 3]);
    });
    test('seed colours outside the palette become gray', () => {
      eq(sample().people.map(p => p.color), ['blue', 'gray']);
    });
    test('migrate fills in missing parts', () => {
      const s = S.migrate({ projects: {}, people: [{ id: 'x', name: 'X', color: '"><b>' }] });
      eq([Array.isArray(s.items), s.settings.capacity, s.people[0].color], [true, 40, 'gray']);
    });

    test('moveItem carries sub-items along', () => {
      const s = sample();
      S.moveItem(s, 'a', 'b', true);
      eq(order(s), ['b', 'a', 'a1', 'a2', 'c']);
    });
    test('moveItem refuses to drop an item into its own sub-items', () => {
      const s = sample();
      eq(S.moveItem(s, 'a', 'a1', true), false);
      eq(order(s), ['a', 'a1', 'a2', 'b', 'c']);
    });
    test('nudgeItem hops over a whole block', () => {
      const s = sample();
      S.nudgeItem(s, 'b', -1);
      eq(order(s), ['b', 'a', 'a1', 'a2', 'c']);
      S.nudgeItem(s, 'b', 1);
      eq(order(s), ['a', 'a1', 'a2', 'b', 'c']);
    });
    test('deleteItem removes sub-items and restoreItems puts them back in place', () => {
      const s = sample();
      const deleted = S.deleteItem(s, 'a');
      eq(order(s), ['b', 'c']);
      S.restoreItems(s, deleted);
      eq(order(s), ['a', 'a1', 'a2', 'b', 'c']);
    });
    test('addItem with a leading dash makes a note', () => {
      const s = sample();
      const it = S.addItem(s, 'p_26208', '- call the PM', 0);
      eq([it.kind, it.text, order(s).pop()], ['note', 'call the PM', it.id]);
    });

    test('peekWeek previews a copy of last week without storing it', () => {
      const s = sample();
      s.weeks['2026-10-05'] = { entries: [{ pid: 'p_26208', hours: '6', label: 'QA/QC', day: 'Fri', date: '', done: true }] };
      const next = S.peekWeek(s, '2026-10-12');
      eq(next.entries, [{ pid: 'p_26208', hours: '6', label: '', day: '', date: '' }]);
      eq(Object.keys(s.weeks), ['2026-10-05']);
      S.ensureWeek(s, '2026-10-12');
      eq(Object.keys(s.weeks).sort(), ['2026-10-05', '2026-10-12']);
    });
    test('closePastWeeks freezes tasks as they stood that week', () => {
      const s = sample();
      s.weeks['2020-01-06'] = { entries: [{ pid: 'p_26208', hours: '', label: '', day: '', date: '' }] };
      s.items.forEach(i => { i.created = '2020-01-01'; });
      s.items[3].done = true;
      s.items[3].doneAt = '2020-01-08';
      eq(S.closePastWeeks(s), 1);
      s.items = [];
      const frozen = s.weeks['2020-01-06'].closed.items.p_26208;
      eq([frozen.length, frozen[3].done, frozen[0].done], [5, true, false]);
      eq(S.closePastWeeks(s), 0);
    });

    test('a timer across midnight is split per day', () => {
      const s = sample();
      const realNow = Date.now;
      const start = new Date(2026, 9, 13, 23, 30).getTime();
      s.timer = { pid: 'p_26208', start };
      Date.now = () => start + 90 * 60000;
      try {
        const logged = S.stopTimer(s);
        eq(logged.map(e => [e.date, e.minutes]), [['2026-10-13', 30], ['2026-10-14', 60]]);
      } finally {
        Date.now = realNow;
      }
    });
    test('a timer under a minute logs nothing', () => {
      const s = sample();
      s.timer = { pid: 'p_26208', start: Date.now() - 20000 };
      eq([S.stopTimer(s).length, s.timer, s.time.length], [0, null, 0]);
    });

    test('setDayMinutes trims the latest blocks, keeps them on the clock, and undo restores them', () => {
      const s = sample();
      const at = (h, m) => new Date(2026, 9, 13, h, m).getTime();
      const block = (id, h1, m1, h2, m2) => ({ id, pid: 'p_26208', date: '2026-10-13', start: at(h1, m1), end: at(h2, m2), minutes: (h2 - h1) * 60 + m2 - m1, note: '', src: 'timer' });
      s.time = [block('t1', 8, 0, 8, 30), block('t2', 9, 0, 9, 40), block('t3', 13, 0, 13, 20)];
      const change = S.setDayMinutes(s, 'p_26208', '2026-10-13', 60);
      eq(s.time.map(t => [t.id, t.minutes]), [['t1', 30], ['t2', 30]]);
      eq(s.time[1].end === at(9, 30), true);
      S.undoDayEdit(s, change);
      eq(s.time.map(t => t.id).sort(), ['t1', 't2', 't3']);
    });
    test('setDayMinutes stretches the last block when there is room, else adds a block in a free slot', () => {
      const s = sample();
      const at = (h, m) => new Date(2026, 9, 13, h, m).getTime();
      s.time = [
        { id: 'a', pid: 'p_26208', date: '2026-10-13', start: at(9, 0), end: at(10, 0), minutes: 60, note: '', src: 'timer' },
        { id: 'b', pid: 'OH', date: '2026-10-13', start: at(10, 0), end: at(10, 30), minutes: 30, note: '', src: 'timer' }
      ];
      S.setDayMinutes(s, 'OH', '2026-10-13', 45);
      eq([s.time[1].end === at(10, 45), s.time[1].minutes], [true, 45]);
      S.setDayMinutes(s, 'p_26208', '2026-10-13', 90);
      const added = s.time.find(t => t.pid === 'p_26208' && t.id !== 'a');
      eq([added.start === at(8, 0), added.minutes], [true, 30]);
    });
    test('roundDay snaps each project to a quarter hour but leaves tiny ones alone', () => {
      const s = sample();
      const at = (h, m) => new Date(2026, 9, 13, h, m).getTime();
      const e = (id, pid, h, minutes) => ({ id, pid, date: '2026-10-13', start: at(h, 0), end: at(h, 0) + minutes * 60000, minutes, note: '', src: 'timer' });
      s.time = [e('a', 'p_26208', 8, 50), e('b', 'p_26208', 10, 21), e('c', 'OH', 12, 6), e('d', 'p_25063', 14, 30)];
      eq(S.roundDay(s, '2026-10-13').length, 1);
      eq(['p_26208', 'OH', 'p_25063'].map(pid => S.minutesFor(s, pid, '2026-10-13', '2026-10-13')), [75, 6, 30]);
      eq(s.time.length, 4);
    });
    test('migrate gives hand-entered time without a clock time a free slot', () => {
      const at = (h, m) => new Date(2026, 9, 13, h, m).getTime();
      const s = S.migrate({ projects: {}, time: [
        { id: 'a', pid: 'OH', date: '2026-10-13', start: at(8, 0), end: at(9, 0), minutes: 60 },
        { id: 'b', pid: 'OH', date: '2026-10-13', start: 0, end: 0, minutes: 45 }
      ] });
      eq([s.time[1].start === at(9, 0), s.time[1].end === at(9, 45)], [true, true]);
    });
    test('dayGaps finds untracked stretches, and fillGap / skips close them', () => {
      const s = sample();
      const at = (h, m) => new Date(2026, 10, 2, h, m).getTime();
      const blk = (id, h1, m1, h2, m2) => ({ id, pid: 'p_26208', date: '2026-11-02', start: at(h1, m1), end: at(h2, m2), minutes: 0, note: '', src: 'timer' });
      s.time = [blk('a', 8, 0, 9, 0), blk('b', 9, 3, 10, 0), blk('c', 10, 30, 11, 0)];
      const gaps = S.dayGaps(s, '2026-11-02');
      eq(gaps.map(g => [g.from === at(10, 0), g.to === at(10, 30)]), [[true, true]]);
      S.fillGap(s, 'OH', '2026-11-02', gaps[0].from, gaps[0].to);
      eq([S.dayGaps(s, '2026-11-02').length, S.minutesFor(s, 'OH', '2026-11-02', '2026-11-02')], [0, 30]);
    });
    test('snapDay moves blocks to quarter hours and unsnapDay puts them back', () => {
      const s = sample();
      const at = (h, m) => new Date(2026, 10, 2, h, m).getTime();
      s.time = [{ id: 'a', pid: 'p_26208', date: '2026-11-02', start: at(8, 2), end: at(8, 39), minutes: 37, note: '', src: 'timer' }];
      const before = S.snapDay(s, '2026-11-02');
      eq([s.time[0].start === at(8, 0), s.time[0].end === at(8, 45), s.time[0].minutes], [true, true, 45]);
      S.unsnapDay(s, before);
      eq(s.time[0].minutes, 37);
    });
    test('stopTimer can stop at an earlier moment', () => {
      const s = sample();
      const start = Date.now() - 5 * 3600000;
      s.timer = { pid: 'p_26208', start };
      const logged = S.stopTimer(s, start + 90 * 60000);
      eq(logged.reduce((a, e) => a + e.minutes, 0), 90);
    });

    test('breaks block out time but never count toward totals', () => {
      const s = sample();
      const at = (h, m) => new Date(2026, 10, 2, h, m).getTime();
      s.time = [
        { id: 'a', pid: 'p_26208', date: '2026-11-02', start: at(8, 0), end: at(12, 0), minutes: 240, note: '', src: 'timer' },
        { id: 'l', pid: 'BREAK', date: '2026-11-02', start: at(12, 0), end: at(12, 30), minutes: 30, note: '', src: 'break' }
      ];
      eq([S.minutesFor(s, null, '2026-11-02', '2026-11-02'), S.minutesFor(s, 'BREAK', '2026-11-02', '2026-11-02')], [240, 30]);
      eq(S.freeSlot(s, '2026-11-02', 60 * 60000) === at(12, 30), true);
    });
    test('old "not work" gaps become Break blocks', () => {
      const at = (h, m) => new Date(2026, 10, 2, h, m).getTime();
      const s = S.migrate({ projects: {}, gapSkips: { '2026-11-02': [`${at(12, 0)}-${at(12, 45)}`] } });
      eq([s.time.length, s.time[0].pid, s.time[0].minutes, Object.keys(s.gapSkips).length], [1, 'BREAK', 45, 0]);
    });
    test('an item deleted after a week ended still shows in that week', () => {
      const s = sample();
      s.items.forEach(i => { i.created = '2026-10-01'; });
      S.deleteItem(s, 'b');
      s.trash.forEach(x => { x.deletedAt = '2026-10-20'; });
      eq(S.itemsAsOf(s, 'p_26208', '2026-10-12').map(i => i.text), ['a', 'a1', 'a2', 'b', 'c']);
      eq(S.itemsAsOf(s, 'p_26208', '2026-10-19').map(i => i.text), ['a', 'a1', 'a2', 'c']);
      eq(S.itemsFor(s, 'p_26208').map(i => i.id), ['a', 'a1', 'a2', 'c']);
    });
    test('typing a tag symbol first tags a new item', () => {
      const s = sample();
      const made = ['! call PM', '? which panel', '* due Fri', 'p1 panels', 'P3 later', 'plain', '2 panels to update']
        .map(t => S.addItem(s, 'p_26208', t, 0));
      eq(made.map(i => i.tag), ['important', 'question', 'highlight', 'p1', 'p3', '', '']);
      eq(made.map(i => i.text).slice(3), ['panels', 'later', 'plain', '2 panels to update']);
    });
    test('old tags fold into the new set', () => {
      const s = S.migrate({ projects: {}, items: [{ id: 'a', tag: 'critical' }, { id: 'b', tag: 'remember' }, { id: 'c', tag: 'idea' }] });
      eq(s.items.map(i => i.tag), ['important', 'highlight', '']);
    });

    test('mergeSeed fills blanks and keeps your edits', () => {
      const s = sample();
      s.projects.p_26208.name = 'Clinic (renamed)';
      const added = S.mergeSeed(s, {
        people: [{ name: 'Cy', colour: 'teal' }],
        projects: [{ number: '26208', name: 'Clinic', revit: 'RVT26' }, { number: '26300', name: 'New', pm: 'Cy' }]
      });
      eq([added, s.projects.p_26208.name, s.projects.p_26208.revit, s.projects.p_26300.pm], [1, 'Clinic (renamed)', 'RVT26', 'pm_cy']);
    });

    document.getElementById('summary').innerHTML = failed
      ? `<b class="fail">${failed} failed</b>`
      : `<b class="pass">All ${out.children.length} passed</b>`;
  </script>
</body>
</html>
